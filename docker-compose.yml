version: '3.8'
services:
  backend:
    build: .
    ports:
      - '5000:5000'
    volumes:
      - .:/app
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    ports:
      - '3000:3000'
    environment:
      - CHOKIDAR_USEPOLLING=true

  db:
    image: sqlite:latest
    command: ["/bin/sh", "-c", "sleep infinity"]
